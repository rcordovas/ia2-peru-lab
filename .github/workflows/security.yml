name: security-pipeline

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: SAST - CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  sca-sbom:
    name: SCA + SBOM - Trivy/CycloneDX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Trivy filesystem SCA (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: reports/trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-sca
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - name: Upload SCA and SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sca-sbom-reports
          path: |
            reports/trivy-fs.sarif
            reports/sbom.cdx.json

  secrets:
    name: Secret scan - Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks scan (synthetic finding expected)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo \
            --redact \
            --report-format json \
            --report-path /repo/reports/gitleaks.json \
            --exit-code 0
      - name: Validate no unexpected token-like secrets outside lab fixture
        run: node scripts/validate-source-secrets.js
      - uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: reports/gitleaks.json

  iac-container:
    name: IaC + container scan - Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: iac
          format: sarif
          output: reports/trivy-iac.sarif
          exit-code: '0'
      - name: Build QA training image
        run: docker build -f docker/Dockerfile.qa -t ia2-peru:qa .
      - name: Container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ia2-peru:qa
          format: sarif
          output: reports/trivy-container.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
      - name: Upload IaC SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-iac.sarif
          category: trivy-iac
      - name: Upload container SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-container.sarif
          category: trivy-container
      - uses: actions/upload-artifact@v6
        with:
          name: iac-container-reports
          path: reports/*.sarif
